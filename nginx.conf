server {
    listen 80;
    server_name _;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # SSE / ストリーミング共通設定
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    proxy_buffering          off;
    proxy_cache              off;
    add_header               X-Accel-Buffering no;

    # 共通プロキシヘッダー
    proxy_http_version       1.1;
    proxy_set_header         Host              $host;
    proxy_set_header         X-Real-IP         $remote_addr;
    proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header         X-Forwarded-Proto $scheme;

    # WebSocket / SSE対応
    proxy_set_header         Upgrade           $http_upgrade;
    proxy_set_header         Connection        "upgrade";

    # SSE長時間接続タイムアウト（1時間）
    proxy_read_timeout       3600s;
    proxy_send_timeout       3600s;
    proxy_connect_timeout    10s;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/* → cocoro-console (Next.js) へ全転送
    #
    # 【重要】 /api/ 以下は全てNext.jsのAPIルートが処理する。
    #   - セッション認証・レート制限・暗号化はNext.js内で実施
    #   - Next.jsルートが内部で cocoro-core:8000 / cocoro-agent:8002 に接続
    #   - nginxがcoreに直接転送すると認証バイパス・502の原因になる
    #
    # 対象エンドポイント（全てNext.js APIルートとして実装済み）:
    #   /api/chat/stream      SSEストリーミング
    #   /api/chat             チャット履歴CRUD
    #   /api/nodes/           マルチノード管理 (SQLite)
    #   /api/nodes/[id]/health ノードヘルスチェック
    #   /api/sync/state       シンクロ率（core→フォールバック）
    #   /api/node/emotion     感情状態（core→フォールバック）
    #   /api/memory           メモリ管理
    #   /api/memory/search    メモリ検索
    #   /api/brief/daily      デイリーブリーフィング
    #   /api/health           サービスヘルス集約
    #   /api/stats            統計
    #   /api/setup            Boot Wizard
    #   /api/agent-proxy      cocoro-agentプロキシ
    #   /api/profile          プロフィール
    #   /api/session          セッション管理
    #   /api/logs             セキュリティログ
    #   /api/tasks            タスク管理
    #   /api/identity         デバイスID
    #   /api/settings/*       設定
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/ {
        proxy_pass           http://cocoro-console:3000;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        # SSE用: バッファリング無効
        proxy_buffering      off;
        proxy_cache          off;
        # SSEの長時間接続に対応
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # cocoro-core への直接ルーティング（/api/ を経由しないパス）
    #
    # cocoro-core のネイティブエンドポイントに直接アクセスする場合のみ。
    # 通常のコンソール操作はNext.js APIルート経由なので不要だが、
    # 外部ツール / デバッグ用に残す。
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location ~ ^/(chat|health|emotion|memory|personality|org|monitor|auth|agent|brain|evolution|governance|sync|think|voice|context|notify|setup|nodes|brief) {
        proxy_pass           http://cocoro-core:8000;
        proxy_buffering      off;
        proxy_cache          off;
        add_header           X-Accel-Buffering no;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     Connection        '';
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # cocoro-agent へのルーティング（/agent/* → :8002）
    # SSE対応・タスク進捗ストリーミング
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /agent/ {
        rewrite              ^/agent/(.*)$ /$1 break;
        proxy_pass           http://cocoro-agent:8002;
        proxy_buffering      off;
        proxy_cache          off;
        add_header           X-Accel-Buffering no;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     Connection        '';
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # それ以外 → cocoro-console (Next.js フロントエンド)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location / {
        proxy_pass           http://cocoro-console:3000;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     Upgrade           $http_upgrade;
        proxy_set_header     Connection        "upgrade";
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }
}
