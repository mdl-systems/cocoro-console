server {
    listen 80;
    server_name _;

    # ── SSE / チャットストリーミング対応 ─────────────────────────
    proxy_buffering          off;
    proxy_cache              off;
    add_header               X-Accel-Buffering no;

    # ── 共通プロキシ設定 ──────────────────────────────────────────
    proxy_http_version       1.1;
    proxy_set_header         Host              $host;
    proxy_set_header         X-Real-IP         $remote_addr;
    proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header         X-Forwarded-Proto $scheme;

    # ── WebSocket 対応（Next.js HMR / SSE） ──────────────────────
    proxy_set_header         Upgrade           $http_upgrade;
    proxy_set_header         Connection        "upgrade";

    # ── タイムアウト（SSE の長時間接続に対応） ────────────────────
    proxy_read_timeout       3600s;
    proxy_send_timeout       3600s;

    # ── /api/emotion/ → cocoro-core（/api/ より先に評価）──────────
    location /api/emotion/ {
        proxy_pass http://cocoro-core:8000/emotion/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── /api/sync/ → cocoro-core /sync/（/api/ より先に評価）──────
    location /api/sync/ {
        proxy_pass http://cocoro-core:8000/sync/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Next.js API Routes（最優先）──────────────────────────────
    location /api/ {
        proxy_pass http://cocoro-console:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── cocoro-core へのルーティング ──────────────────────────────
    location ~ ^/(chat|health|emotion|memory|personality|org|monitor|auth|agent|brain|evolution|governance) {
        proxy_pass http://cocoro-core:8000;
        proxy_buffering          off;
        proxy_cache              off;
        add_header               X-Accel-Buffering no;
        proxy_http_version       1.1;
        proxy_set_header         Host              $host;
        proxy_set_header         X-Real-IP         $remote_addr;
        proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header         Connection        '';
        proxy_read_timeout       3600s;
        proxy_send_timeout       3600s;
    }

    # ── cocoro-agent へのルーティング ─────────────────────────────
    location /agent/ {
        proxy_pass http://cocoro-agent:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── cocoro-agent へのルーティング (/agent/* → :8002) ─────────
    # SSE対応（タスク進捗ストリーミング）・長時間タイムアウト設定
    location /agent/ {
        # /agent/tasks → cocoro-agent:8002/tasks のように strip して転送
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass http://cocoro-agent:8002;
        proxy_buffering          off;
        proxy_cache              off;
        add_header               X-Accel-Buffering no;
        proxy_http_version       1.1;
        proxy_set_header         Host              $host;
        proxy_set_header         X-Real-IP         $remote_addr;
        proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header         Connection        '';
        proxy_read_timeout       3600s;
        proxy_send_timeout       3600s;
    }

    # ── cocoro-console へのルーティング（それ以外）────────────────
    location / {
        proxy_pass http://cocoro-console:3000;
    }
}

