# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# map ディレクティブ（http コンテキスト）
# conf.d/default.conf は nginx の http{} ブロック内に include されるため
# server{} の外に map を記述できる。
#
# /api/sync/state?mode=history → /sync/history
# /api/sync/state              → /sync/rate
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
map $arg_mode $sync_core_path {
    "history"   /sync/history;
    default     /sync/rate;
}

server {
    listen 80;
    server_name _;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Docker 内蔵 DNS で動的解決（コンテナ不在でも nginx が起動できる）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $upstream_console  http://cocoro-console:3000;
    set $upstream_core     http://cocoro-core:8000;
    set $upstream_agent    http://cocoro-agent:8002;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 共通プロキシ設定
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    proxy_http_version    1.1;
    proxy_buffering       off;
    proxy_cache           off;
    add_header            X-Accel-Buffering no;

    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      Upgrade           $http_upgrade;
    proxy_set_header      Connection        "upgrade";

    # Authorization ヘッダーを明示的に転送（JWT Bearer トークン）
    proxy_set_header      Authorization     $http_authorization;

    proxy_connect_timeout 10s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/chat  →  cocoro-console:3000 (Next.js)
    #
    # チャット履歴(SQLite) + SSEストリーミング(JWT取得→core転送)は
    # Next.js が仲介する。直接 core に転送すると JWT 認証が通らない。
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/chat {
        proxy_pass        $upstream_console;
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/health  →  cocoro-core:8000/health
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location ~ ^/api/health(/.*)?$ {
        set $suffix $1;
        proxy_pass        $upstream_core/health$suffix;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/emotion/state  →  cocoro-core:8000/emotion/state  (完全一致優先)
    # /api/emotion/*      →  cocoro-core:8000/emotion/*
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location = /api/emotion/state {
        proxy_pass        $upstream_core/emotion/state;
    }

    location ~ ^/api/emotion(/.*)?$ {
        set $suffix $1;
        proxy_pass        $upstream_core/emotion$suffix;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/memory         →  cocoro-core:8000/memory/list  (完全一致)
    # /api/memory/search  →  cocoro-core:8000/memory/search
    # /api/memory/*       →  cocoro-core:8000/memory/*
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location = /api/memory {
        proxy_pass        $upstream_core/memory/list;
    }

    location ~ ^/api/memory(/.*)?$ {
        set $suffix $1;
        proxy_pass        $upstream_core/memory$suffix;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/sync/state  →  cocoro-core:8000/sync/rate  (デフォルト)
    #                  →  cocoro-core:8000/sync/history (?mode=history 時)
    # /api/sync/*      →  cocoro-core:8000/sync/*
    #
    # map $arg_mode $sync_core_path で ?mode=history を /sync/history に変換
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location = /api/sync/state {
        proxy_pass        $upstream_core$sync_core_path;
    }

    location ~ ^/api/sync(/.*)?$ {
        set $suffix $1;
        proxy_pass        $upstream_core/sync$suffix;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/nodes  →  cocoro-core:8000/nodes
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location ~ ^/api/nodes(/.*)?$ {
        set $suffix $1;
        proxy_pass        $upstream_core/nodes$suffix;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/brief/daily  →  cocoro-core:8000/brief/daily
    # /api/brief/*      →  cocoro-core:8000/brief/*
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location ~ ^/api/brief(/.*)?$ {
        set $suffix $1;
        proxy_pass        $upstream_core/brief$suffix;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/think  →  cocoro-core:8000/think
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location ~ ^/api/think(/.*)?$ {
        set $suffix $1;
        proxy_pass        $upstream_core/think$suffix;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/agent-proxy  →  cocoro-console:3000 (Next.js 認証ラッパー)
    # /api/agent/*      →  cocoro-agent:8002（直接・SSE対応）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/agent-proxy {
        proxy_pass        $upstream_console;
    }

    location ~ ^/api/agent(/.*)?$ {
        set $suffix $1;
        proxy_pass        $upstream_agent/agent$suffix;
        proxy_buffering   off;
        proxy_cache       off;
        proxy_set_header  Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/node  →  cocoro-console:3000 (Next.js)
    # /api/node/emotion など内部で core に接続する実装がある
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/node {
        proxy_pass        $upstream_console;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Next.js 専用 APIルート（SQLite / セッション / 設定）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/setup    { proxy_pass $upstream_console; }
    location /api/session  { proxy_pass $upstream_console; }
    location /api/profile  { proxy_pass $upstream_console; }
    location /api/settings { proxy_pass $upstream_console; }
    location /api/logs     { proxy_pass $upstream_console; }
    location /api/identity { proxy_pass $upstream_console; }
    location /api/stats    { proxy_pass $upstream_console; }
    location /api/tasks    { proxy_pass $upstream_console; }
    location /api/webhooks { proxy_pass $upstream_console; }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/ その他 → cocoro-console:3000（フォールバック）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/ {
        proxy_pass        $upstream_console;
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /agent/*  →  cocoro-agent:8002（直接・SSE対応）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location ~ ^/agent(/.*)?$ {
        set $suffix $1;
        proxy_pass        $upstream_agent$suffix;
        proxy_buffering   off;
        proxy_cache       off;
        add_header        X-Accel-Buffering no;
        proxy_set_header  Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /  →  cocoro-console:3000 (Next.js フロントエンド)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location / {
        proxy_pass        $upstream_console;
        proxy_set_header  Upgrade    $http_upgrade;
        proxy_set_header  Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
