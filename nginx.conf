server {
    listen 80;
    server_name _;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 共通設定
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    proxy_http_version    1.1;
    proxy_buffering       off;
    proxy_cache           off;
    add_header            X-Accel-Buffering no;

    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      Upgrade           $http_upgrade;
    proxy_set_header      Connection        "upgrade";

    proxy_connect_timeout 10s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/chat  →  cocoro-console:3000 (Next.js)
    #
    # チャットはNext.jsが仲介する:
    #   - /api/chat        : 履歴CRUD (SQLite)
    #   - /api/chat/stream : SSEストリーミング（JWT取得→core転送）
    # cocoro-coreに直接転送するとJWT認証が通らない。
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/chat {
        proxy_pass        http://cocoro-console:3000;
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/health  →  cocoro-core:8000/health
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/health {
        rewrite ^/api/health(/.*)? /health$1 break;
        proxy_pass        http://cocoro-core:8000;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/emotion  →  cocoro-core:8000/emotion
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/emotion {
        rewrite ^/api/emotion(/.*)? /emotion$1 break;
        proxy_pass        http://cocoro-core:8000;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/memory  →  cocoro-core:8000/memory
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/memory {
        rewrite ^/api/memory(/.*)? /memory$1 break;
        proxy_pass        http://cocoro-core:8000;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/sync  →  cocoro-core:8000/sync
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/sync {
        rewrite ^/api/sync(/.*)? /sync$1 break;
        proxy_pass        http://cocoro-core:8000;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/nodes  →  cocoro-core:8000/nodes
    # （マルチノード情報は cocoro-core が管理）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/nodes {
        rewrite ^/api/nodes(/.*)? /nodes$1 break;
        proxy_pass        http://cocoro-core:8000;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/brief  →  cocoro-core:8000/brief
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/brief {
        rewrite ^/api/brief(/.*)? /brief$1 break;
        proxy_pass        http://cocoro-core:8000;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/think  →  cocoro-core:8000/think
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/think {
        rewrite ^/api/think(/.*)? /think$1 break;
        proxy_pass        http://cocoro-core:8000;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/agent  →  cocoro-agent:8002
    # /api/agent-proxy は Next.js 経由（認証ラッパー）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/agent-proxy {
        proxy_pass        http://cocoro-console:3000;
    }

    location /api/agent {
        rewrite ^/api/agent(/.*)? /agent$1 break;
        proxy_pass        http://cocoro-agent:8002;
        proxy_buffering   off;
        proxy_cache       off;
        proxy_set_header  Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/node  →  cocoro-console:3000 (Next.js)
    # /api/node/emotion など内部でcoreに繋ぐ実装がある
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/node {
        proxy_pass        http://cocoro-console:3000;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Next.js専用APIルート（SQLite / セッション / 設定）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/setup {
        proxy_pass        http://cocoro-console:3000;
    }

    location /api/session {
        proxy_pass        http://cocoro-console:3000;
    }

    location /api/profile {
        proxy_pass        http://cocoro-console:3000;
    }

    location /api/settings {
        proxy_pass        http://cocoro-console:3000;
    }

    location /api/logs {
        proxy_pass        http://cocoro-console:3000;
    }

    location /api/identity {
        proxy_pass        http://cocoro-console:3000;
    }

    location /api/stats {
        proxy_pass        http://cocoro-console:3000;
    }

    location /api/tasks {
        proxy_pass        http://cocoro-console:3000;
    }

    location /api/webhooks {
        proxy_pass        http://cocoro-console:3000;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # /api/ その他 → cocoro-console:3000（フォールバック）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/ {
        proxy_pass        http://cocoro-console:3000;
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # cocoro-agent 直接アクセス（/agent/* → :8002）
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /agent/ {
        rewrite           ^/agent/(.*)$ /$1 break;
        proxy_pass        http://cocoro-agent:8002;
        proxy_buffering   off;
        proxy_cache       off;
        add_header        X-Accel-Buffering no;
        proxy_set_header  Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # / → cocoro-console:3000 (Next.js フロントエンド)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location / {
        proxy_pass        http://cocoro-console:3000;
        proxy_set_header  Upgrade    $http_upgrade;
        proxy_set_header  Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
