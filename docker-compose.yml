version: '3.8'

services:
  cocoro-console:
    build: .
    container_name: cocoro-console
    # ポートは nginx 経由でのみ公開（外部に直接公開しない）
    expose:
      - "3000"
    volumes:
      # Persist SQLite database and device identity
      - cocoro_data:/app/.cocoro
    environment:
      # ─── cocoro-core connection ───────────────────
      - COCORO_CORE_URL=${COCORO_CORE_URL:-http://host.docker.internal:8001}
      - COCORO_CORE_API_KEY=${COCORO_CORE_API_KEY:-}
      - COCORO_CORE_ENABLED=${COCORO_CORE_ENABLED:-false}
      # ─── Security ─────────────────────────────────
      - COCORO_ENCRYPT_CHAT=${COCORO_ENCRYPT_CHAT:-false}
      - COCORO_PIN=${COCORO_PIN:-}
    restart: unless-stopped
    networks:
      - cocoro-net

  nginx:
    image: nginx:alpine
    container_name: cocoro-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cocoro-console
    extra_hosts:
      # cocoro-core が Docker 外（ホストマシン）で動いている場合のフォールバック
      - "cocoro-core:host-gateway"
    restart: unless-stopped
    networks:
      - cocoro-net
      - docker_default

networks:
  cocoro-net:
    driver: bridge
  docker_default:
    external: true

volumes:
  cocoro_data:
    driver: local
