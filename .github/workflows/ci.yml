name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (includes type-check)
        run: npm run build
        env:
          COCORO_CORE_ENABLED: 'false'
          COCORO_ENCRYPT_CHAT: 'false'
          COCORO_CORE_URL: 'http://localhost:8001'
          COCORO_CORE_API_KEY: 'ci-placeholder'
